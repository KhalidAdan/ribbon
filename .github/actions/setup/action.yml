# What the checks and the release builds both need: Node, Rust and what
# whisper.cpp is built with on this system, then the npm packages.
name: Set up the build
description: Node, Rust, whisper.cpp's build tools and the npm packages.

inputs:
  ffmpeg:
    description: Install ffmpeg and ffprobe, which make the tests' fixtures.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Rust (stable)
      shell: bash
      run: rustup toolchain install stable --profile minimal && rustup default stable

    # whisper.cpp's Vulkan shaders build in folders so deep that MSBuild's file
    # tracker fails past 260 characters (FTK1011). target/ at the root of the
    # PC's checkout is short enough (.cargo/config.toml); under the runner's,
    # D:\a\ribbon\ribbon, it is not, so on Windows Cargo builds into C:\t.
    # BUNDLES is where `tauri build` leaves the installers.
    - name: Where Cargo builds
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
          echo 'BUNDLES=C:/t/release/bundle' >> "$GITHUB_ENV"
        else
          echo 'BUNDLES=target/release/bundle' >> "$GITHUB_ENV"
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        # Compiled output remembers where its source was: a new key, so a cache from before the desktop moved is never used.
        prefix-key: v1-rust
        workspaces: packages/desktop/src-tauri -> ../../../target
        # It joins a workspace's target to the workspace, so C:\t goes in whole.
        cache-directories: ${{ runner.os == 'Windows' && 'C:\t' || '' }}
        # A tag's cache can be read by no other run (each sees its own and
        # main's), and the repository's caches share 10 GB: a tag saves none.
        save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    # whisper.cpp's Vulkan backend is built with the SDK (VULKAN_SDK, glslc),
    # and the Rust tests need its runtime, vulkan-1.dll, which a runner without
    # a graphics card lacks. LLVM (libclang, for bindgen) and CMake come with
    # the runner. The SDK is the version the PC builds with.
    - name: Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.363.0
        install_runtime: true
        cache: true

    - name: ffmpeg (Mac)
      if: inputs.ffmpeg == 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install ffmpeg

    # The build Chocolatey installed (Gyan's essentials), at a version of our own, from its GitHub release: 33 MB in
    # seconds, where Chocolatey took half a minute and its feed failed now and then, sometimes for hours. A new
    # version is its tag and the archive's checksum, which the release page shows.
    - name: ffmpeg (Windows)
      if: inputs.ffmpeg == 'true' && runner.os == 'Windows'
      shell: bash
      env:
        FFMPEG: 9.0.2
        FFMPEG_SHA256: 4705843ccaaf54257c16ad90f3e952ece33c17df964ecf7bfdbb0f49c7171077
      run: |
        archive="$RUNNER_TEMP/ffmpeg.7z"
        curl -fsSL --retry 3 -o "$archive" "https://github.com/GyanD/codexffmpeg/releases/download/$FFMPEG/ffmpeg-$FFMPEG-essentials_build.7z"
        [ "$(sha256sum < "$archive" | cut -d' ' -f1)" = "$FFMPEG_SHA256" ] || { echo "::error::ffmpeg $FFMPEG's archive is not the one expected"; exit 1; }
        bin="$RUNNER_TEMP/ffmpeg"
        7z e "$archive" -o"$bin" -r ffmpeg.exe ffprobe.exe > /dev/null
        "$bin/ffmpeg" -version > /dev/null 2>&1 && "$bin/ffprobe" -version > /dev/null 2>&1 || { echo "::error::ffmpeg could not be installed"; exit 1; }
        cygpath -w "$bin" >> "$GITHUB_PATH"

    - name: npm packages
      shell: bash
      run: npm ci
