# The server's Docker image on GitHub's registry, so running a server means
# pulling an image rather than building one. Each version tag publishes its own,
# and `latest`. By hand, it publishes the branch it's run on, as a test.
name: Server image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Each kind of machine builds the image for itself: the Rust tools took 13
  # minutes for ARM under emulation, and 2 on Intel. Each is pushed by its digest
  # alone, without a tag, for the next job to join.
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # An image's name is in lower case, and the owner's name need not be.
      - name: The image's name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ribbon-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # No build cache: a tag's cache can't be read by the next tag, and each
      # version changes the Rust stage anyway. The repository's caches share
      # 10 GB, which the checks need.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: The digest, for the next job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two as one image under the version's tags: Docker pulls the one that
  # suits the machine.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The image's name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ribbon-server" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
      - name: The two under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Both are there
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$tag" | tee inspect.txt
          for platform in linux/amd64 linux/arm64; do
            grep -qE "Platform: +$platform\$" inspect.txt || { echo "::error::$tag has no $platform image"; exit 1; }
          done

  # A second copy of each version's image on another registry, in case GitHub's
  # is lost or out of reach. Where it goes is kept in the repository's secrets,
  # not here: BACKUP_IMAGE (the image's whole name there, registry first),
  # BACKUP_USERNAME and BACKUP_PASSWORD. Without them, as in a fork, there is
  # nothing to do. The copy goes from registry to registry, both kinds of
  # machine at once.
  backup:
    name: Back up
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_IMAGE: ${{ secrets.BACKUP_IMAGE }}
      BACKUP_USERNAME: ${{ secrets.BACKUP_USERNAME }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Whether there is somewhere to copy to
        id: where
        run: |
          if [ -n "$BACKUP_IMAGE" ] && [ -n "$BACKUP_USERNAME" ] && [ -n "$BACKUP_PASSWORD" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No backup registry is set, so the image is on GitHub's registry alone."
          fi
      - name: The image's name, and the version
        if: steps.where.outputs.set
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ribbon-server" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: steps.where.outputs.set
      - name: Sign in to the backup registry
        if: steps.where.outputs.set
        run: docker login "${BACKUP_IMAGE%%/*}" --username "$BACKUP_USERNAME" --password-stdin <<< "$BACKUP_PASSWORD"
      - name: Copy the version across
        if: steps.where.outputs.set
        run: docker buildx imagetools create --tag "$BACKUP_IMAGE:$VERSION" "$IMAGE:$VERSION"
      # A copy is a backup only if it is the same image: the two digests say so.
      - name: The copy is the same image
        if: steps.where.outputs.set
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          published=$(digest "$IMAGE:$VERSION")
          copied=$(digest "$BACKUP_IMAGE:$VERSION")
          echo "published $published"
          echo "copied    $copied"
          [ -n "$published" ] && [ "$published" = "$copied" ] || { echo "::error::The backup of $VERSION is not the image that was published"; exit 1; }
