# The checks on every pull request and every push to main: the types, the
# unit tests and the Rust side, on the two systems Ribbon ships for. The
# end-to-end checks are not here: they need the PC's local test library
# (docs/RELEASING.md).
name: Checks

on:
  pull_request:
    # A change to the docs alone runs nothing here.
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest moved to Visual Studio 2026 in June 2026; Ribbon's
        # build has not been tried there yet, so this stays on 2022 for now.
        os: [windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ffmpeg: true
      - run: npm run typecheck
      - run: npm test
      # After the unit tests: the Rust side reads the fixtures they generate.
      - run: npm run test:rust
      # A build for a phone writes the signer's Apple team into the iOS project,
      # and this repository is public (docs/MAC.md, the phone).
      - name: No Apple team in the iOS project
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if grep -qE 'DEVELOPMENT_TEAM = "?[A-Z0-9]' src-tauri/gen/apple/ribbon.xcodeproj/project.pbxproj; then
            echo "::error::src-tauri/gen/apple/ribbon.xcodeproj/project.pbxproj names an Apple development team: leave it out of the commit"
            exit 1
          fi

  # The server (server/, docs/SERVER.md) is its own Node package, with its own
  # dependencies and tests. It runs on Linux and Mac hosts; it's checked on a
  # Mac, where ffmpeg installs reliably (Ubuntu's mirror stalled the install
  # past its time limit twice) and where it's first hosted.
  server:
    name: Server
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # Adding books reads them with ffprobe and makes covers with ffmpeg.
      - run: brew install ffmpeg
      # The server runs src/core/ from the app, which brings its own packages.
      - run: npm ci --ignore-scripts
        working-directory: .
      # Read-along reads EPUBs with Ribbon's own parser (src-tauri/ebook), which the tests run.
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target
      - run: cargo build --manifest-path src-tauri/Cargo.toml -p ribbon-ebook
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Ribbon on the Apple TV (tv/, tv/README.md), built for the simulator so it
  # keeps building. Nothing is signed: the Apple team is the signer's own.
  tv:
    name: Apple TV
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The app bundles the reader's own faces from the npm packages.
      - run: npm ci --ignore-scripts
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: tv
      - run: xcodebuild -project RibbonTV.xcodeproj -scheme Ribbon -destination 'generic/platform=tvOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: tv
