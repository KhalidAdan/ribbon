# The checks on every pull request and every push to main: the types, the
# unit tests and the Rust side, on the two systems Ribbon ships for. The
# end-to-end checks are not here: they need the PC's local test library
# (docs/RELEASING.md).
name: Checks

on:
  pull_request:
    # A change to the docs alone runs nothing here.
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request can reach, so the slow jobs run only where they could
  # notice something (tools/what-changed.mjs). main always runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      server: ${{ steps.paths.outputs.server }}
      image: ${{ steps.paths.outputs.image }}
      apple: ${{ steps.paths.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        run: node tools/what-changed.mjs >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        # windows-latest moved to Visual Studio 2026 in June 2026; Ribbon's
        # build has not been tried there yet, so this stays on 2022 for now.
        os: [windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ffmpeg: true
      - run: npm run typecheck
      - run: npm test
      # After the unit tests: the Rust side reads the fixtures they generate.
      - run: npm run test:rust
      # A build for a phone writes the signer's Apple team into the iOS project,
      # and this repository is public (docs/MAC.md, the phone).
      - name: No Apple team in the iOS project
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if grep -qE 'DEVELOPMENT_TEAM = "?[A-Z0-9]' packages/desktop/src-tauri/gen/apple/ribbon.xcodeproj/project.pbxproj; then
            echo "::error::packages/desktop/src-tauri/gen/apple/ribbon.xcodeproj/project.pbxproj names an Apple development team: leave it out of the commit"
            exit 1
          fi

  # The server (packages/server/, docs/SERVER.md) has its own tests. It runs on Linux and
  # Mac hosts; it's checked on a
  # Mac, where ffmpeg installs reliably (Ubuntu's mirror stalled the install
  # past its time limit twice) and where it's first hosted.
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Adding books reads them with ffprobe and makes covers with ffmpeg.
      - run: brew install ffmpeg
      - run: npm ci --ignore-scripts
        working-directory: .
      # Read-along reads EPUBs with Ribbon's own parser and finds MP3 frames with its own index (packages/desktop/src-tauri/ebook, packages/desktop/src-tauri/frames), which the tests run.
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Compiled output remembers where its source was: a new key, so a cache from before the desktop moved is never used.
          prefix-key: v1-rust
          workspaces: packages/desktop/src-tauri -> ../../../target
      - run: cargo build --manifest-path packages/desktop/src-tauri/Cargo.toml -p ribbon-ebook -p ribbon-frames
        working-directory: .
      - run: npm run typecheck
      - run: npm test

  # The server's Docker image, built and started as a stranger would: nothing
  # else sees the Dockerfile, and a deploy is otherwise the first to.
  server-image:
    name: Server image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: tools/check-server-image.sh
      - name: The compose file is valid
        run: RIBBON_BOOKS=/tmp docker compose -f packages/server/compose.yaml config --quiet

  # Whether this pull request built the same app as what it's based on. It
  # always says; with the label `same-app`, for a change meant to change
  # nothing, a difference fails it (docs/RELEASING.md).
  same-app:
    name: Same app
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # A pull request is checked merged onto its base, so the first parent is exactly what it's compared with.
      - run: git worktree add ../base HEAD^1
      - run: npm ci --ignore-scripts
        working-directory: ../base
      - run: npm run build
        working-directory: ../base
      - name: Compare the two
        id: compare
        shell: bash
        run: |
          set +e
          node tools/same-app.mjs ../base . | tee same-app.txt
          status=${PIPESTATUS[0]}
          { echo '```'; cat same-app.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        continue-on-error: ${{ !contains(github.event.pull_request.labels.*.name, 'same-app') }}

  # Ribbon on the Apple TV, the iPad and the iPhone (packages/apple/README.md), built for each
  # simulator so it keeps building. Nothing is signed: the Apple team is the
  # signer's own.
  apple:
    name: Apple app
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The app bundles the reader's own faces from the npm packages.
      - run: npm ci --ignore-scripts
      - run: brew install xcodegen
      # A runner's simulator takes about four minutes to start the first time,
      # so the iPhone's starts here, to boot while the app builds. Not before the
      # installs: its first boot is hard on the disk, and npm ci took four
      # minutes beside it rather than seconds.
      - name: Start an iPhone simulator
        run: |
          phone=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(Object.values(JSON.parse(s).devices).flat().find((d)=>d.name.startsWith("iPhone")).udid))')
          echo "PHONE=$phone" >> "$GITHUB_ENV"
          nohup xcrun simctl bootstatus "$phone" -b > "$RUNNER_TEMP/boot.log" 2>&1 &
      - run: xcodegen generate
        working-directory: packages/apple
      - run: xcodebuild -project Ribbon.xcodeproj -scheme Ribbon -destination 'generic/platform=tvOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: packages/apple
      - run: xcodebuild -project Ribbon.xcodeproj -scheme Ribbon -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: packages/apple
      # Whether the app can read the server's real answers (packages/server/test/api-contract.test.ts writes them).
      - name: The app reads the server's answers
        working-directory: packages/apple
        run: |
          xcrun simctl bootstatus "$PHONE"
          xcodebuild test -project Ribbon.xcodeproj -scheme Ribbon -destination "platform=iOS Simulator,id=$PHONE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO
