# The installers for a release. Pushing a version tag (vX.Y.Z) makes a draft
# release and attaches the Windows installers and the Mac disk image to it,
# with the files installed Ribbons update themselves from and latest.json,
# which says where they are; publishing stays by hand, after the end-to-end
# checks (docs/RELEASING.md). Publishing is what ships the update: every
# install asks for the newest published release's latest.json, and a draft
# isn't one.
name: Release

on:
  push:
    tags: ["v*"]
    # On main they're built too, as downloads on the run, when what they're
    # built from changes, as every version's commit does: so a tag finds Rust's
    # build in main's cache, the only one a tag can read, rather than compiling
    # Tauri and whisper.cpp from nothing (7 minutes rather than 2). Not on every
    # push: GitHub's Macs are scarce, and each run takes one. Paths are not
    # looked at for a tag.
    branches: [main]
    paths: &builds-the-installers
      - .github/workflows/release.yml
      - .github/actions/setup/**
      - .cargo/**
      - "**/package.json"
      - package-lock.json
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/tauri.conf.json"
      - "**/vite.config.ts"
      - packages/desktop/tools/with-build-env.mjs
  # Build a tag's installers again: a run failed, or its release is missing one.
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag (vX.Y.Z). Files already on its release are replaced."
        required: true
  # A pull request that changes how the installers are built builds them,
  # as downloads on the run, without releasing anything. Otherwise a tag is the
  # first to find a build that no longer works on the Mac.
  pull_request:
    paths: *builds-the-installers

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}

jobs:
  draft:
    name: Draft release
    # RELEASING, which a job's condition can't read.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: The tag is the desktop's version
        shell: bash
        run: |
          version="v$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::$TAG is not the version in packages/desktop/package.json ($version)"
            exit 1
          fi
      - name: A draft release for the tag, unless it has one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release; its files will be replaced."
          else
            gh release create "$TAG" --draft --verify-tag --title "Ribbon ${TAG#v}" --notes "Notes to come."
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: draft
    # On a pull request or main there is no draft to wait for.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # The same systems as the checks (checks.yml says why Windows is 2022).
        # The files are in BUNDLES, which the setup step sets. Each update file
        # has its signature beside it (.sig): on Windows the installers are the
        # updates, and the Mac's is the app itself, packed (.app.tar.gz).
        include:
          - os: windows-2022
            files: nsis/*.exe nsis/*.exe.sig msi/*.msi msi/*.msi.sig
          - os: macos-26
            files: dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASING == 'true' && env.TAG || '' }}
      # The setup step as this workflow has it: a tag from before it was
      # written has none of its own.
      - uses: actions/checkout@v7
        with:
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/setup
        with:
          ffmpeg: false
      # The cache can bring an earlier build's installers with it (on Windows it
      # keeps the whole of C:\t), and the steps below take every installer they
      # find: 0.26.1's draft got main's 0.26.0 beside its own.
      - name: No installers from an earlier build
        shell: bash
        run: |
          find "$BUNDLES" -maxdepth 2 -name 'Ribbon_*' -exec echo "From an earlier build: {}" \; 2>/dev/null || true
          rm -rf "$BUNDLES"
      # A release without the key would have no update files, and no
      # installed Ribbon would ever hear of it.
      - name: The release key is here
        if: env.RELEASING == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: the release's updates can't be signed (docs/RELEASING.md, section 6)"
            exit 1
          fi
      # The plain build: no RIBBON_PROFILE. On the Mac, GitHub's CI=true makes
      # the disk image without scripting Finder. The update files are signed
      # with the release key; without it (a pull request from a fork) they're
      # left out (packages/desktop/tools/with-build-env.mjs).
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Tauri names the Mac's update Ribbon.app.tar.gz, for every version: it's
      # named here as the disk image is, so a release's files say what they are.
      - name: The Mac's update, by its version
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ env.BUNDLES }}/macos
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/packages/desktop/package.json').version")"
          for f in Ribbon.app.tar.gz Ribbon.app.tar.gz.sig; do
            if [ -f "$f" ]; then mv "$f" "Ribbon_${version}_aarch64${f#Ribbon}"; fi
          done
          ls -l
      - name: Attach to the release
        if: env.RELEASING == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ env.BUNDLES }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
      - name: Keep as downloads on the run
        if: env.RELEASING != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ env.BUNDLES }}/nsis/*.exe
            ${{ env.BUNDLES }}/nsis/*.exe.sig
            ${{ env.BUNDLES }}/msi/*.msi
            ${{ env.BUNDLES }}/msi/*.msi.sig
            ${{ env.BUNDLES }}/dmg/*.dmg
            ${{ env.BUNDLES }}/macos/*.app.tar.gz
            ${{ env.BUNDLES }}/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # latest.json, once both systems' files are on the draft: the version, and
  # for each system the file to fetch and its signature (tools/latest-json.mjs).
  # Only when both built, so a manifest never leaves a system out.
  latest:
    name: Update manifest (latest.json)
    needs: installers
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # The script as this workflow has it, as with the setup step above.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - name: Write latest.json and attach it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/signatures"
          gh release download "$TAG" --pattern '*.sig' --dir "$RUNNER_TEMP/signatures" --clobber
          node tools/latest-json.mjs "$TAG" "$RUNNER_TEMP/signatures" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
