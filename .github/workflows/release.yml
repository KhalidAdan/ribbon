# The installers for a release. Pushing a version tag (vX.Y.Z) makes a draft
# release and attaches the Windows installers and the Mac disk image to it;
# publishing stays by hand, after the end-to-end checks (docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
    # On main they're built too, as downloads on the run, when what they're
    # built from changes, as every version's commit does: so a tag finds Rust's
    # build in main's cache, the only one a tag can read, rather than compiling
    # Tauri and whisper.cpp from nothing (7 minutes rather than 2). Not on every
    # push: GitHub's Macs are scarce, and each run takes one. Paths are not
    # looked at for a tag.
    branches: [main]
    paths: &builds-the-installers
      - .github/workflows/release.yml
      - .github/actions/setup/**
      - .cargo/**
      - "**/package.json"
      - package-lock.json
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/tauri.conf.json"
      - "**/vite.config.ts"
      - packages/desktop/tools/with-build-env.mjs
  # Build a tag's installers again: a run failed, or its release is missing one.
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag (vX.Y.Z). Files already on its release are replaced."
        required: true
  # A pull request that changes how the installers are built builds them,
  # as downloads on the run, without releasing anything. Otherwise a tag is the
  # first to find a build that no longer works on the Mac.
  pull_request:
    paths: *builds-the-installers

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}

jobs:
  draft:
    name: Draft release
    # RELEASING, which a job's condition can't read.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: The tag is the desktop's version
        shell: bash
        run: |
          version="v$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::$TAG is not the version in packages/desktop/package.json ($version)"
            exit 1
          fi
      - name: A draft release for the tag, unless it has one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release; its files will be replaced."
          else
            gh release create "$TAG" --draft --verify-tag --title "Ribbon ${TAG#v}" --notes "Notes to come."
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: draft
    # On a pull request or main there is no draft to wait for.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # The same systems as the checks (checks.yml says why Windows is 2022).
        # The files are in BUNDLES, which the setup step sets.
        include:
          - os: windows-2022
            files: nsis/*.exe msi/*.msi
          - os: macos-26
            files: dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASING == 'true' && env.TAG || '' }}
      # The setup step as this workflow has it: a tag from before it was
      # written has none of its own.
      - uses: actions/checkout@v7
        with:
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/setup
        with:
          ffmpeg: false
      # The plain build: no RIBBON_PROFILE. On the Mac, GitHub's CI=true makes
      # the disk image without scripting Finder.
      - run: npm run tauri build
      - name: Attach to the release
        if: env.RELEASING == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ env.BUNDLES }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
      - name: Keep as downloads on the run
        if: env.RELEASING != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ env.BUNDLES }}/nsis/*.exe
            ${{ env.BUNDLES }}/msi/*.msi
            ${{ env.BUNDLES }}/dmg/*.dmg
          if-no-files-found: error
