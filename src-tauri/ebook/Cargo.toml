[package]
name = "ribbon-ebook"
version = "0.15.0"
description = "Ribbon's EPUB parser: a book's text as the reader lays it out (docs/READING.md, section 4)."
authors = ["Khalid Adan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "ribbon_ebook"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.12"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
imagesize = "0.15.0"
# Only to tell line art from pictures, for the reader's dark mode: the
# four formats EPUBs carry, no encoders beyond what those bring, no threads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
