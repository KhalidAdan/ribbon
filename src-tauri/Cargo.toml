[package]
name = "odio"
version = "0.1.0"
description = "The listener for books you own."
authors = ["Khalid Adan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "odio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
lofty = "0.25"
rayon = "1.12"
walkdir = "2.5"

# Dev builds still scan at full speed: the tag reader and our own
# scanner are optimized even when the rest of the tree is not.
[profile.dev.package.lofty]
opt-level = 3

[profile.dev.package.odio]
opt-level = 2
