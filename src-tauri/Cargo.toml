[package]
name = "ribbon"
version = "0.10.1"
description = "The listener for books you own."
authors = ["Khalid Adan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ribbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
lofty = "0.25"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
imagesize = "0.15.0"
# Only to tell line art from pictures, for the reader's dark mode: the
# four formats EPUBs carry, no encoders beyond what those bring, no threads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
whisper-rs = { version = "0.16", features = ["vulkan"] }

# Dev builds still scan at full speed: the tag reader and our own
# scanner are optimized even when the rest of the tree is not.
[profile.dev.package.lofty]
opt-level = 3

[profile.dev.package.ribbon]
opt-level = 2

# Image decoding, for the same reason: a book's images are read once, on first open.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# whisper.cpp is C++ built by cmake: optimised even in dev builds, or a
# few seconds of speech take minutes.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
