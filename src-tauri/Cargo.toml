# The app, and the EPUB parser, MP3 frame index and speech it shares with the server.
[workspace]
members = ["ebook", "frames", "speech"]

[package]
name = "ribbon"
version = "0.22.2"
description = "The listener for books you own."
authors = ["Khalid Adan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ribbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
# The folders a listener chooses on iOS, kept open across launches (plugins/folders).
tauri-plugin-folders = { path = "plugins/folders" }
lofty = "0.25"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
fs4 = "0.13"
# The EPUB parser and the MP3 frame index, crates of their own so the server can build them alone.
ribbon-ebook = { path = "ebook" }
ribbon-frames = { path = "frames" }
# The read-along export writes a copy of the EPUB.
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The export's tests read the chapters it wrote.
quick-xml = "0.39.4"

# Speech (whisper.cpp, in a crate of its own) on the GPU: Metal on
# Apple's systems, Vulkan on Windows and Linux. Android runs it on the CPU for now. How it is
# compiled: tools/with-build-env.mjs.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
ribbon-speech = { path = "speech", features = ["metal"] }
# Transcribing behind playback: a thread's quality-of-service class.
libc = "0.2"

# Keeping the computer awake while it transcribes (awake.rs): an activity on macOS, a thread's request on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "android")'.dependencies]
ribbon-speech = { path = "speech" }

[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
ribbon-speech = { path = "speech", features = ["vulkan"] }

# Dev builds still scan at full speed: the tag reader and our own
# scanner are optimized even when the rest of the tree is not.
[profile.dev.package.lofty]
opt-level = 3

[profile.dev.package.ribbon]
opt-level = 2

[profile.dev.package.ribbon-ebook]
opt-level = 2

# A 10-hour MP3 is read whole to index it.
[profile.dev.package.ribbon-frames]
opt-level = 3

# Image decoding, for the same reason: a book's images are read once, on first open.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# whisper.cpp is C++ built by cmake: optimised even in dev builds, or a
# few seconds of speech take minutes.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
