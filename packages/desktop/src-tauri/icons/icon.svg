<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="0.75" stop-color="#ebe6dc"/>
      <stop offset="1" stop-color="#d3ccbe"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3ccbe"/>
      <stop offset="0.25" stop-color="#ebe6dc"/>
      <stop offset="1" stop-color="#f6f3ec"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8920f"/>
      <stop offset="0.4" stop-color="#f7b443"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="drop" x="-40%" y="-10%" width="180%" height="130%">
      <feDropShadow dx="5" dy="8" stdDeviation="7" flood-color="#3b2300" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- The tile: Ribbon's near-black canvas, with a hairline for an edge. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="2"/>

  <g clip-path="url(#tileClip)">
    <!-- The boards of a hardback, open. -->
    <path filter="url(#lift)" fill="#2b2b2b" stroke="#fff" stroke-opacity="0.1" stroke-width="2"
      d="M512 334 C450 304 296 294 178 308 L178 738 C296 728 450 740 512 782 C574 740 728 728 846 738 L846 308 C728 294 574 304 512 334 Z"/>

    <!-- The page block's edge, under the open pages. -->
    <path fill="#c9c1b2" d="M512 744 C452 710 300 702 196 714 L196 732 C300 720 452 730 512 764 Z"/>
    <path fill="#c9c1b2" d="M512 744 C572 710 724 702 828 714 L828 732 C724 720 572 730 512 764 Z"/>

    <!-- The open pages. -->
    <path fill="url(#pageL)" d="M512 318 C452 288 300 276 196 292 L196 714 C300 702 452 710 512 744 Z"/>
    <path fill="url(#pageR)" d="M512 318 C572 288 724 276 828 292 L828 714 C724 702 572 710 512 744 Z"/>

    <!-- Read: lines of text on the left page. -->
    <g stroke="#8f8a80" stroke-opacity="0.45" stroke-width="15" stroke-linecap="round">
      <line x1="252" y1="368" x2="452" y2="372"/>
      <line x1="252" y1="414" x2="452" y2="418"/>
      <line x1="252" y1="460" x2="452" y2="464"/>
      <line x1="252" y1="506" x2="452" y2="510"/>
      <line x1="252" y1="552" x2="452" y2="556"/>
      <line x1="252" y1="598" x2="390" y2="601"/>
    </g>

    <!-- Heard: a voice, on the right page. -->
    <g stroke="#8f8a80" stroke-opacity="0.45" stroke-width="15" stroke-linecap="round">
      <line x1="580" y1="470" x2="580" y2="514"/>
      <line x1="610" y1="440" x2="610" y2="544"/>
      <line x1="640" y1="404" x2="640" y2="580"/>
      <line x1="670" y1="446" x2="670" y2="538"/>
      <line x1="700" y1="384" x2="700" y2="600"/>
      <line x1="730" y1="428" x2="730" y2="556"/>
      <line x1="760" y1="462" x2="760" y2="522"/>
    </g>

    <!-- Your place: the amber ribbon in the gutter, out past the pages. -->
    <g filter="url(#drop)">
      <path fill="url(#ribbon)"
        d="M483 316 H541 V752 C541 790 553 816 566 840 L570 868 L540 842 L508 868 L508 850 C495 822 483 792 483 752 Z"/>
      <path fill="url(#fold)" d="M483 738 H541 V790 H483 Z"/>
    </g>
  </g>
</svg>
