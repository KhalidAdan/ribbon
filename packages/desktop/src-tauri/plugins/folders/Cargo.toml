[package]
name = "tauri-plugin-folders"
version = "0.1.0"
description = "The folders a listener chooses on iOS, opened in place and kept open across launches."
authors = ["Khalid Adan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-folders"

[dependencies]
tauri = "2.11.3"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
