# A Ribbon server, from the published image. In a folder of its own:
#
#   RIBBON_BOOKS=/path/to/your/books docker compose up -d
#   docker compose logs      # the first start prints the link that makes the admin
#
# Its data stays in ./ribbon-data beside this file: back that up. packages/server/README.md
# says how to reach it from elsewhere.
services:
  ribbon:
    image: ghcr.io/khalidadan/ribbon-server:latest
    restart: unless-stopped
    # On this machine's loopback, where a proxy such as Tailscale Serve or Caddy
    # reaches it, and where it takes passwords. Docker Desktop on a Mac needs its
    # host networking turned on in its settings.
    network_mode: host
    user: "${RIBBON_UID:-1000}:${RIBBON_GID:-1000}"
    environment:
      RIBBON_URL: ${RIBBON_URL:-http://localhost:7766}
      RIBBON_FOLDERS: /media
    volumes:
      - ./ribbon-data:/data
      - ${RIBBON_BOOKS:?say where your books are}:/media:ro
